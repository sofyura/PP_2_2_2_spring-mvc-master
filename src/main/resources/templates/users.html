<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление пользователями</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 8px; }
        form { margin-top: 20px; }
        .input-group { margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>Список пользователей</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Email</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.name}">Имя</td>
        <td th:text="${u.lastName}">Фамилия</td>
        <td th:text="${u.email}">email@example.com</td>
        <td>
            <a th:href="@{/users(id=${u.id})}">Изменить</a>
            <a th:href="@{/users/delete(id=${u.id})}">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>

<hr/>

<h3 th:text="${user.id == null} ? 'Добавить пользователя' : 'Редактировать пользователя'">Форма</h3>

<form th:action="@{/users/save}" th:object="${user}" method="POST">
    <input type="hidden" th:field="*{id}"/>

    <div class="input-group">
        <label>Имя:</label>
        <!-- Исправлено: name вместо firstName -->
        <input type="text" th:field="*{name}" required/>
    </div>

    <div class="input-group">
        <label>Фамилия:</label>
        <input type="text" th:field="*{lastName}" required/>
    </div>

    <div class="input-group">
        <label>Email:</label>
        <input type="email" th:field="*{email}" required/>
    </div>

    <button type="submit">Сохранить</button>
    <a th:if="${user.id != null}" th:href="@{/users}">Отмена</a>
</form>

</body>
</html>
